<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Giosuè Palliotto</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Playfair+Display:wght@400;700&display=swap');
    :root {
      --bg-color: #FDF8F5;
      --surface-color: #FFFFFF;
      --clay-color: #E8B4A0;
      --slate-color: #3A3A3A;
      --muted-color: #A09890;
      --border-color: #F0E8E4;
    }
    body {
      margin: 0;
      background: var(--bg-color);
      color: var(--slate-color);
      font-family: 'Outfit', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 2rem;
      overflow: hidden;
    }
    h1 { font-family: 'Playfair Display', serif; font-size: 8rem; margin: 0; color: var(--clay-color); line-height: 1; }
    .plane {
      display: inline-block;
      font-size: 3rem;
      animation: wobble 1.5s ease-in-out infinite;
    }
    @keyframes wobble {
      0%, 100% { transform: translateX(0) rotate(0deg); }
      25% { transform: translateX(-12px) rotate(-8deg); }
      75% { transform: translateX(12px) rotate(8deg); }
    }
    h2 { font-family: 'Playfair Display', serif; font-size: 1.5rem; font-weight: 400; margin: 0.5rem 0 1rem; color: var(--slate-color); }
    .blame { color: var(--muted-color); font-size: 0.8rem; margin-bottom: 0.25rem; opacity: 0.6; }
    p { color: var(--muted-color); font-size: 0.95rem; line-height: 1.6; margin: 0 0 2rem; }
    a {
      display: inline-block;
      background: var(--clay-color);
      color: white;
      text-decoration: none;
      padding: 0.75rem 2rem;
      border-radius: 1rem;
      font-weight: 500;
      font-size: 0.9rem;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div>
    <div class="plane">✈️</div>
    <h1>404</h1>
    <h2>This page crashed</h2>
    <p class="blame">(probably my RC plane hit it)</p>
    <p>I can't find what you're looking for.<br>Which is embarrassing, because I'm literally trained to find things.</p>
    <a href="/">← Back to a page that exists</a>
  </div>
</body>
</html>
