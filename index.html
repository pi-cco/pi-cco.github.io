  <script type="text/babel" data-type="module">

    import { Plane, Award, Send, ArrowRight, Github, Linkedin, FileText, Activity, Database, Cpu, Mountain, Utensils, Headphones, ChevronDown } from 'lucide-react';

    const ParallaxBackground = () => {
      const { scrollYProgress } = useScroll();
      const smoothProgress = useSpring(scrollYProgress, { damping: 20, stiffness: 100 });
      
      const mountainY = useTransform(smoothProgress, [0, 1], ['0%', '20%']);
      const blob1Y = useTransform(smoothProgress, [0, 1], ['0%', '40%']);
      const blob2Y = useTransform(smoothProgress, [0, 1], ['0%', '-40%']);
      const blob1X = useTransform(smoothProgress, [0, 1], ['0%', '15%']);
      const blob2X = useTransform(smoothProgress, [0, 1], ['0%', '-15%']);

      return (
        <>
          <div className="fixed top-0 left-0 w-[100vw] h-[100vh] z-[-2] overflow-hidden pointer-events-none">
            <motion.div 
              style={{ y: blob1Y, x: blob1X }}
              className="absolute -top-[10%] -left-[10%] w-[50vw] h-[50vw] bg-clay blur-[90px] rounded-full opacity-15"
            />
            <motion.div 
              style={{ y: blob2Y, x: blob2X }}
              className="absolute -bottom-[20%] -right-[10%] w-[60vw] h-[60vw] bg-slate blur-[90px] rounded-full opacity-10"
            />
          </div>
          <motion.div 
            style={{ y: mountainY }}
            className="mountain-overlay"
          />
        </>
      );
    };

    const RCPlane = () => {
      const { scrollYProgress } = useScroll();
      const smoothProgress = useSpring(scrollYProgress, { damping: 15, stiffness: 100 });

      // Plane movement
      const x = useTransform(smoothProgress, p => `${10 + 75 * p + 25 * Math.sin(p * Math.PI * 2)}vw`);
      const y = useTransform(smoothProgress, p => `${5 + 90 * p}vh`);
      const rotate = useTransform(smoothProgress, p => {
        const dx = 75 + 50 * Math.PI * Math.cos(p * Math.PI * 2);
        const dy = 120;
        const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        return angle;
      });

      return (
        <motion.div
          style={{ position: 'fixed', top: 0, left: 0, x, y, rotate, zIndex: 50, pointerEvents: 'none' }}
          className="text-clay drop-shadow-2xl"
        >
          <svg width="56" height="56" viewBox="0 0 512 512" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
            <path d="M256 16C242.7 16 232 26.7 232 40V145.4L48.8 282.8C43.5 286.8 40 293.1 40 300V344C40 350.2 46.5 354.4 52.2 351.5L232 261.6V400L168.8 447.4C163.5 451.4 160 457.7 160 464.6V488C160 494.2 166.5 498.4 172.2 495.5L256 453.6L339.8 495.5C345.5 498.4 352 494.2 352 488V464.6C352 457.7 348.5 451.4 343.2 447.4L280 400V261.6L459.8 351.5C465.5 354.4 472 350.2 472 344V300C472 293.1 468.5 286.8 463.2 282.8L280 145.4V40C280 26.7 269.3 16 256 16Z"/>
          </svg>
        </motion.div>
      );
    };

            </div>

    const Education = () => (

        <div className="absolute -right-20 top-10 opacity-5 text-clay">

        <div className="max-w-6xl mx-auto px-4 md:px-6 grid md:grid-cols-2 gap-12 md:gap-24 items-start relative z-10">
          <motion.div initial={{ opacity: 0, y: 50 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }}>
            <h3 className="text-3xl md:text-4xl font-bold mb-4 md:mb-5 text-center md:text-left text-slate">T.I.M.E. Double Degree Program</h3>

            <div className="flex items-center space-x-6 p-4 bg-surface rounded-3xl shadow-sm border border-border">
