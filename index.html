    const RCPlane = () => {
      const { scrollYProgress } = useScroll();
      const smoothProgress = useSpring(scrollYProgress, { damping: 15, stiffness: 100 });

      // Plane movement
      const x = useTransform(smoothProgress, p => `${10 + 75 * p + 25 * Math.sin(p * Math.PI * 2)}vw`);
      const y = useTransform(smoothProgress, p => `${5 + 90 * p}vh`);
      const rotate = useTransform(smoothProgress, p => {
        const dx = 75 + 50 * Math.PI * Math.cos(p * Math.PI * 2);
        const dy = 120;
        const angle = Math.atan2(dy, dx) * (180 / Math.PI) + 90;
        return angle;
      });

          style={{ position: 'fixed', top: 0, left: 0, x, y, rotate, zIndex: 50, pointerEvents: 'none' }}
